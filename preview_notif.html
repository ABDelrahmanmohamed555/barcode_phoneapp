<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>معاينة الإشعار</title><style>body{margin:0;background:#0d1117;color:#f5f0e3;font-family:sans-serif;padding:16px} .mock{margin:20px auto;max-width:360px;background:#1c2333;border:1px solid #2d3543;border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,0.5)} .mock-header{height:48px;background:#151b23;display:flex;align-items:center;gap:12px;padding:0 12px;border-bottom:2px solid #c8943a} .mock-icon{width:32px;height:32px;border-radius:6px;overflow:hidden;background:#0d1117;border:1px solid #c8943a;display:grid;place-items:center} .mock-icon img{width:100%;height:100%;object-fit:cover} .mock-title{font-weight:700;font-size:13px} .mock-body{padding:12px} .notif{ background:#2d3543;border-radius:8px;padding:10px;display:flex;gap:10px;align-items:center} .notif-icon{width:24px;height:24px;border-radius:4px;overflow:hidden;flex-shrink:0} .notif-icon img{width:100%;height:100%} .notif-text{flex:1;text-align:right} .notif-title{font-size:13px;font-weight:700;color:#f5f0e3} .notif-body{font-size:11px;color:#9e9e9e;margin-top:2px} .notif-time{font-size:10px;color:#6c7a91;white-space:nowrap} button{width:100%;height:44px;background:#c8943a;color:#fff;border:none;border-radius:8px;font-weight:700;margin-top:16px}</style></head><body>
<h2 style="color:#c8943a;text-align:center">معاينة شكل الإشعار</h2>
<p style="color:#9e9e9e;font-size:12px;text-align:center">هذا ما سيظهر في شريط حالة الهاتف حتى لو التطبيق مقفول</p>
<div class="mock">
<div class="mock-header"><div class="mock-icon"><img src="icon.png" onerror="this.style.display='none'"></div><div class="mock-title">شركة النحال لقطع الغيار</div></div>
<div class="mock-body">
<div class="notif"><div class="notif-icon"><img src="icon.png"></div><div class="notif-text"><div class="notif-title">منتج جديد ✓</div><div class="notif-body">اختبار حتى لو مقفول — تمت إضافته</div></div><div class="notif-time">الآن</div></div>
<div style="margin-top:10px;color:#9e9e9e;font-size:11px;text-align:center">🔔 يظهر مع الأيقونة الذهبية + اهتزاز [200,100,200] + badge</div>
</div>
</div>
<button onclick="trigger()">اختبر إشعار حقيقي في الشريط</button>
<script>
function trigger(){
  if('serviceWorker' in navigator){
    navigator.serviceWorker.ready.then(r=>r.showNotification("منتج جديد ✓",{body:"اختبار حتى لو مقفول — تمت إضافته", icon:"./icon.png", badge:"./icon.png", vibrate:[200,100,200], tag:"preview-"+Date.now(), data:{url:"./index.html"}})).then(()=>alert("تم إرسال الإشعار - انظر شريط الحالة")).catch(e=>alert("فشل: "+e));
  } else if(window.cordova && cordova.plugins.notification.local){
    cordova.plugins.notification.local.schedule({id:Date.now()%2147483647, title:"منتج جديد ✓", text:"اختبار حتى لو مقفول", smallIcon:"res://icon", icon:"res://icon", vibrate:true});
    alert("تم عبر Cordova");
  } else alert("جرب في التطبيق المثبت");
}
setTimeout(trigger,800);
</script>
</body></html>
